# Render Blueprint: Node web service + managed Postgres. NOT YET DEPLOYED - see README "Deploying".
# Dashboard: New > Blueprint > this repo, Blueprint path backend/render.yaml.
# You will be prompted for ANTHROPIC_API_KEY (optional) and CORS_ORIGINS (the frontend URL).
services:
  - type: web
    name: bookleaf-api
    runtime: node
    plan: free
    rootDir: backend
    # install (dev deps needed for tsc), prisma generate, tsc + copy KB files
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # prisma migrate deploy, idempotent seed (+ demo tickets when SEED_DEMO_TICKETS=true), then the server
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      # anthropic (default) or gemini. For gemini also set GEMINI_API_KEY and change LLM_MODEL.
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: claude-haiku-5-5
      - key: SEED_DEMO_TICKETS
        value: "true"

databases:
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf
    user: bookleaf
