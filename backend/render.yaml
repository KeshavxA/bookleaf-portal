# Render Blueprint: API (Docker) + managed Postgres. Set ANTHROPIC_API_KEY and CORS_ORIGINS in the dashboard.
services:
  - type: web
    name: bookleaf-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: bookleaf-db, property: connectionString }
      - key: JWT_SECRET
        generateValue: true
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: LLM_MODEL
        value: claude-haiku-5-5
databases:
  - name: bookleaf-db
    plan: free
