# Render Blueprint: Node web service + managed Postgres. Deployed (free plan) at https://bookleaf-api-rfcy.onrender.com - see README "Deploying".
# Dashboard: New > Blueprint > this repo, Blueprint path backend/render.yaml.
# Render will prompt for two values:
#   GEMINI_API_KEY  paste it in the Render dashboard only, never in a file
#   CORS_ORIGINS    the frontend's exact origin. Use http://localhost:5173 first, then replace it
#                   with the real frontend URL after the frontend is deployed.
# To switch to Anthropic instead: set LLM_PROVIDER=anthropic and LLM_MODEL=claude-haiku-5-5,
# and add ANTHROPIC_API_KEY in the dashboard.
services:
  - type: web
    name: bookleaf-api
    runtime: node
    plan: free
    rootDir: backend
    # install (dev deps needed for tsc), prisma generate, tsc + copy KB files
    buildCommand: npm ci --include=dev && npx prisma generate && npm run build
    # prisma migrate deploy, idempotent seed (+ demo tickets when SEED_DEMO_TICKETS=true), then the server
    startCommand: npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bookleaf-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_TIMEOUT_MS
        value: "30000"
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: SEED_DEMO_TICKETS
        value: "true"

databases:
  - name: bookleaf-db
    plan: free
    databaseName: bookleaf
    user: bookleaf
